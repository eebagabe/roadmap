<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roadmaps de estudo em português: Java, React, QA e Dados, com apostilas, projetos e progresso salvo." />
    <title>Roadmap</title>
    <script>
      // Aplica o tema antes da primeira pintura para não piscar.
      try {
        var t = localStorage.getItem('roadmap:tema')
        if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </body>
</html>
